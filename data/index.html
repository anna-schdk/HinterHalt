<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HinterHalt</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #222;

            animation: redBlink 0.5s infinite alternate;
        }

        @keyframes redBlink {
            from {
                background: #ff0000;
            }
            to {
                background: #cc0000;
            }
        }

        .container {
            width: 90%;
            max-width: 480px;

            background: rgba(255, 255, 255, 0.95);

            padding: 35px;

            border-radius: 22px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           Überschrift
           ========================= */

        h1 {
            margin: 0;

            font-size: 40px;

            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;

            color: #777;

            font-size: 16px;
        }


        /* =========================
           Verbindung
           ========================= */

        #connectButton {

            width: 100%;

            margin-top: 30px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            background: #222;

            color: white;

            transition: 0.2s;
        }

        #connectButton:hover {
            background: #444;
        }

        #connectButton:disabled {
            opacity: 0.6;
            cursor: default;
        }


        /* =========================
           Status
           ========================= */

        #status {

            margin-top: 18px;

            font-size: 15px;

            color: #777;
        }

        .connected {
            color: green !important;
        }

        .error {
            color: red !important;
        }


        /* =========================
           Abstand
           ========================= */

        .distance-box {

            margin-top: 30px;

            padding: 25px;

            border-radius: 16px;

            background: #f1f3f5;
        }

        .distance-title {

            font-size: 16px;

            color: #666;
        }

        .distance {

            margin-top: 8px;

            font-size: 58px;

            font-weight: bold;
        }

        .unit {

            font-size: 19px;

            color: #666;
        }


        /* =========================
           Warnung
           ========================= */

        #warning {

            display: none;

            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            background: #ffdddd;

            border: 3px solid red;

            color: red;

            font-size: 21px;

            font-weight: bold;

            animation: warningBlink 0.5s infinite alternate;
        }

        @keyframes warningBlink {

            from {
                opacity: 1;
            }

            to {
                opacity: 0.45;
            }
        }


        /* =========================
           LED Steuerung
           ========================= */

        .led-box {

            margin-top: 30px;

            padding: 22px;

            border-radius: 16px;

            background: #f1f3f5;
        }

        .led-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        #blinkButton {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            background: #444;

            color: white;
        }

        #blinkButton.active {

            background: #d60000;
        }


        /* =========================
           LED Status
           ========================= */

        #ledStatus {

            margin-top: 12px;

            font-size: 14px;

            color: #777;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         Titel
         ========================= -->

    <h1>HinterHalt</h1>

    <div class="subtitle">
        Abstandswarnsystem
    </div>


    <!-- =========================
         Verbindung
         ========================= -->

    <button id="connectButton">

        Mit HinterHalt verbinden

    </button>


    <div id="status">

        Nicht verbunden

    </div>


    <!-- =========================
         Abstand
         ========================= -->

    <div class="distance-box">

        <div class="distance-title">

            Abstand zum Fahrzeug

        </div>


        <div class="distance" id="distance">

            --

        </div>


        <div class="unit">

            Meter

        </div>

    </div>


    <!-- =========================
         Warnung
         ========================= -->

    <div id="warning">

        ⚠️ WARNUNG<br>

        Fahrzeug nähert sich schnell!

    </div>


    <!-- =========================
         LED Steuerung
         ========================= -->

    <div class="led-box">

        <div class="led-title">

            LED-Steuerung

        </div>


        <button id="blinkButton">

            LED-Blinkmodus einschalten

        </button>


        <div id="ledStatus">

            Blinkmodus ausgeschaltet

        </div>

    </div>


</div>


<script>


    // ==================================================
    // BLE UUIDs
    // ==================================================

    const SERVICE_UUID =
        "12345678-1234-1234-1234-1234567890ab";


    // Abstand
    const DISTANCE_UUID =
        "abcd1234-5678-90ab-cdef-1234567890ab";


    // Warnung
    const WARNING_UUID =
        "11111111-2222-3333-4444-555555555555";


    // LED Steuerung
    const LED_CONTROL_UUID =
        "66666666-7777-8888-9999-aaaaaaaaaaaa";


    // ==================================================
    // Variablen
    // ==================================================

    let device = null;

    let server = null;

    let distanceCharacteristic = null;

    let warningCharacteristic = null;

    let ledControlCharacteristic = null;

    let blinkMode = false;


    // ==================================================
    // HTML Elemente
    // ==================================================

    const connectButton =
        document.getElementById("connectButton");


    const status =
        document.getElementById("status");


    const distance =
        document.getElementById("distance");


    const warning =
        document.getElementById("warning");


    const blinkButton =
        document.getElementById("blinkButton");


    const ledStatus =
        document.getElementById("ledStatus");


    // ==================================================
    // BLE Verbindung
    // ==================================================

    connectButton.addEventListener(
        "click",
        connectBLE
    );


    async function connectBLE()
    {

        try
        {

            status.textContent =
                "Suche nach HinterHalt...";

            status.className = "";


            // ------------------------------------------
            // Gerät suchen
            // ------------------------------------------

            device =
                await navigator.bluetooth.requestDevice({

                    filters: [

                        {
                            name: "HinterHalt"
                        }

                    ],

                    optionalServices: [

                        SERVICE_UUID

                    ]

                });


            status.textContent =
                "Verbinde mit HinterHalt...";


            // ------------------------------------------
            // GATT Verbindung
            // ------------------------------------------

            server =
                await device.gatt.connect();


            console.log(
                "BLE verbunden"
            );


            // ------------------------------------------
            // Service
            // ------------------------------------------

            const service =
                await server.getPrimaryService(
                    SERVICE_UUID
                );


            // ------------------------------------------
            // Abstand
            // ------------------------------------------

            distanceCharacteristic =
                await service.getCharacteristic(
                    DISTANCE_UUID
                );


            await distanceCharacteristic.startNotifications();


            distanceCharacteristic.addEventListener(
                "characteristicvaluechanged",
                handleDistance
            );


            // ------------------------------------------
            // Warnung
            // ------------------------------------------

            warningCharacteristic =
                await service.getCharacteristic(
                    WARNING_UUID
                );


            await warningCharacteristic.startNotifications();


            warningCharacteristic.addEventListener(
                "characteristicvaluechanged",
                handleWarning
            );


            // ------------------------------------------
            // LED Steuerung
            // ------------------------------------------

            ledControlCharacteristic =
                await service.getCharacteristic(
                    LED_CONTROL_UUID
                );


            // ------------------------------------------
            // Verbindung erfolgreich
            // ------------------------------------------

            status.textContent =
                "Verbunden mit HinterHalt";

            status.className =
                "connected";


            connectButton.textContent =
                "Verbunden";

            connectButton.disabled =
                true;


            console.log(
                "Alle BLE Characteristics verbunden"
            );

        }


        catch (error)
        {

            console.error(error);


            status.textContent =
                "Verbindung fehlgeschlagen: " +
                error.message;

            status.className =
                "error";

        }

    }


    // ==================================================
    // Abstand empfangen
    // ==================================================

    function handleDistance(event)
    {

        const value =
            new TextDecoder().decode(
                event.target.value
            );


        console.log(
            "Abstand:",
            value
        );


        const distanceValue =
            parseFloat(value);


        if (!isNaN(distanceValue))
        {

            distance.textContent =
                distanceValue.toFixed(2);

        }

    }


    // ==================================================
    // Warnung empfangen
    // ==================================================

    function handleWarning(event)
    {

        const value =
            new TextDecoder().decode(
                event.target.value
            );


        console.log(
            "Warnung:",
            value
        );


        if (value === "1")
        {

            // Warnung anzeigen

            warning.style.display =
                "block";

        }

        else
        {

            // Warnung ausblenden

            warning.style.display =
                "none";

        }

    }


    // ==================================================
    // Blinkbutton
    // ==================================================

    blinkButton.addEventListener(
        "click",
        toggleBlinkMode
    );


    async function toggleBlinkMode()
    {

        // Prüfen ob BLE verbunden

        if (
            !ledControlCharacteristic
        )
        {

            alert(
                "Bitte zuerst mit HinterHalt verbinden."
            );

            return;

        }


        try
        {

            // ------------------------------------------
            // Blinkmodus EIN
            // ------------------------------------------

            if (!blinkMode)
            {

                const command =
                    new TextEncoder().encode(
                        "BLINK"
                    );


                await ledControlCharacteristic.writeValue(
                    command
                );


                blinkMode = true;


                blinkButton.textContent =
                    "LED-Blinkmodus ausschalten";


                blinkButton.classList.add(
                    "active"
                );


                ledStatus.textContent =
                    "Blinkmodus eingeschaltet";

            }


            // ------------------------------------------
            // Blinkmodus AUS
            // ------------------------------------------

            else
            {

                const command =
                    new TextEncoder().encode(
                        "OFF"
                    );


                await ledControlCharacteristic.writeValue(
                    command
                );


                blinkMode = false;


                blinkButton.textContent =
                    "LED-Blinkmodus einschalten";


                blinkButton.classList.remove(
                    "active"
                );


                ledStatus.textContent =
                    "Blinkmodus ausgeschaltet";

            }

        }


        catch (error)
        {

            console.error(error);


            alert(
                "LED-Befehl konnte nicht gesendet werden."
            );

        }

    }


    // ==================================================
    // BLE Verbindung verloren
    // ==================================================

    if (
        navigator.bluetooth
    )
    {

        console.log(
            "Web Bluetooth verfügbar"
        );

    }


</script>


</body>

</html>
