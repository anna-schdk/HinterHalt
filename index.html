<!DOCTYPE html>

<html lang="de">

<head>

```
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>WalkAlert</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;

        background: #eeeeee;

        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {

        background: white;

        width: 90%;
        max-width: 450px;

        padding: 35px;

        border-radius: 25px;

        text-align: center;

        box-shadow:
            0 5px 20px rgba(0,0,0,0.15);
    }

    h1 {

        font-size: 42px;

        margin: 0 0 10px 0;
    }

    .subtitle {

        color: #777;

        margin-bottom: 30px;
    }

    .status {

        display: inline-block;

        padding: 10px 18px;

        border-radius: 20px;

        background: #eeeeee;

        margin-bottom: 30px;
    }

    .connected {

        background: #d8f5dc;

        color: #16802c;
    }

    .label {

        color: #777;

        font-size: 18px;
    }

    .distance {

        font-size: 75px;

        font-weight: bold;

        margin: 10px 0 25px;
    }

    .unit {

        font-size: 30px;

        color: #777;
    }

    button {

        width: 100%;

        padding: 17px;

        border: none;

        border-radius: 15px;

        background: #222;

        color: white;

        font-size: 18px;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {

        opacity: 0.8;
    }

    button:disabled {

        background: #999;

        cursor: default;
    }

    .error {

        color: #d00000;

        margin-top: 20px;

    }

</style>
```

</head>

<body>

<div class="box">

```
<h1>WalkAlert</h1>

<div class="subtitle">
    Bluetooth Radar
</div>


<div id="status"
     class="status">

    Nicht verbunden

</div>


<div class="label">
    Abstand
</div>


<div class="distance">

    <span id="distance">
        --
    </span>

    <span class="unit">
        m
    </span>

</div>


<button id="connect">

    Mit WalkAlert verbinden

</button>


<div id="error"
     class="error">
</div>
```

</div>

<script>


// ===============================
// BLE UUIDs
// ===============================

const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
    "abcd1234-5678-90ab-cdef-1234567890ab";


// ===============================
// HTML Elemente
// ===============================

const connectButton =
    document.getElementById("connect");

const status =
    document.getElementById("status");

const distance =
    document.getElementById("distance");

const error =
    document.getElementById("error");


// ===============================
// BLE Verbindung
// ===============================

connectButton.addEventListener(
    "click",
    connectBluetooth
);


async function connectBluetooth()
{

    error.textContent = "";

    status.textContent =
        "Suche nach WalkAlert...";

    try
    {

        // Bluetooth Gerät auswählen

        const device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name: "WalkAlert"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        status.textContent =
            "Verbinde...";


        // Verbindung herstellen

        const server =
            await device.gatt.connect();


        // Service suchen

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        // Characteristic suchen

        const characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        // Notifications aktivieren

        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            receiveData
        );


        status.textContent =
            "Verbunden";

        status.classList.add(
            "connected"
        );


        connectButton.textContent =
            "WalkAlert verbunden";

        connectButton.disabled =
            true;


    }

    catch (e)
    {

        console.error(e);

        status.textContent =
            "Nicht verbunden";

        error.textContent =
            "Bluetooth-Verbindung fehlgeschlagen.";

        connectButton.disabled =
            false;

    }

}


// ===============================
// Daten empfangen
// ===============================

function receiveData(event)
{

    const value =
        event.target.value;


    const decoder =
        new TextDecoder(
            "utf-8"
        );


    const text =
        decoder.decode(value).trim();


    console.log(
        "Empfangen:",
        text
    );


    const number =
        parseFloat(text);


    if (!isNaN(number))
    {

        distance.textContent =
            number.toFixed(2);

    }

}


</script>

</body>

</html>
