<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HinterHalt</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 35px;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 25px;
            font-size: 18px;
        }

        .distance-box {
            margin-top: 30px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .distance {
            font-size: 60px;
            font-weight: bold;
            margin-top: 10px;
        }

        .unit {
            font-size: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HinterHalt</h1>

    <div class="subtitle">
        Abstandserkennung
    </div>

    <button id="connectButton">
        Mit HinterHalt verbinden
    </button>

    <div class="status" id="status">
        Nicht verbunden
    </div>

    <div class="distance-box">

        <div>Entfernung</div>

        <div class="distance" id="distance">
            --
        </div>

        <div class="unit">
            Meter
        </div>

    </div>

</div>


<script>

const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
    "abcd1234-5678-90ab-cdef-1234567890ab";


const connectButton =
    document.getElementById("connectButton");

const status =
    document.getElementById("status");

const distance =
    document.getElementById("distance");


connectButton.addEventListener("click", async () => {

    try {

        status.textContent = "Suche HinterHalt...";

        // Bluetooth-Gerät auswählen
        const device = await navigator.bluetooth.requestDevice({

            filters: [
                {
                    name: "HinterHalt"
                }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });


        status.textContent = "Verbinde...";


        // Verbindung herstellen
        const server =
            await device.gatt.connect();


        // Service holen
        const service =
            await server.getPrimaryService(SERVICE_UUID);


        // Characteristic holen
        const characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        // Benachrichtigungen aktivieren
        await characteristic.startNotifications();


        characteristic.addEventListener(
            "characteristicvaluechanged",
            handleDistance
        );


        status.textContent =
            "✓ Mit HinterHalt verbunden";

        connectButton.textContent =
            "Verbunden";


    } catch (error) {

        console.error(error);

        status.textContent =
            "Verbindung fehlgeschlagen: " + error.message;

    }

});


function handleDistance(event) {

    const value =
        new TextDecoder().decode(
            event.target.value
        );

    const distanceValue =
        parseFloat(value);


    if (!isNaN(distanceValue)) {

        distance.textContent =
            distanceValue.toFixed(2);

    }

}

</script>

</body>
</html>
